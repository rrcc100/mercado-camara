services:
  frontend:
    image: mercado-camara-frontend:dev
    build:
      target: development
    environment:
      WATCHPACK_POLLING: "true"
    volumes:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - ./next.config.ts:/app/next.config.ts:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
